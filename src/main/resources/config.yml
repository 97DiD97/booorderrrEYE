border:
  # Максимум блоков за одну команду (0 = без лимита).
  # Меняется здесь или командой: /eye border limit <число>
  max-blocks: 5000
  per-side: true          # true = блоки добавляются с КАЖДОЙ стороны (размер +2N); false = размер +N
  default-seconds: 14     # длительность рисования, если не указана в команде
  charge-seconds: 4       # зарядка (рисование рунического круга)
  fly-speed: 3.0          # скорость полёта глаза к границе (блоков за тик)
  fly-timeout-seconds: 45 # если не долетел - переносится

shake:
  enabled: true
  strength: 1.0           # сила тряски экрана
  radius: 0               # 0 = трясёт всех игроков в мире; иначе только в этом радиусе от места рисования
  rotation: true          # дрожание камеры (поворот головы)
  tilt: true              # наклон экрана, как при уроне
